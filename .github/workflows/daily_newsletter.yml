name: Daily Newsletter Automation

on:
  schedule:
    - cron: '1 0 * 11,12,1,2,3 *' # 00:01 UK (GMT)
    - cron: '1 23 * 4-10 *' # 00:01 UK (BST)
    - cron: '0 10 * 11,12,1,2,3 *' # 10:00 UK (GMT)
    - cron: '0 9 * 4-10 *' # 10:00 UK (BST)
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

# Opt into Node.js 24 for all JavaScript actions (avoids Node 20 deprecation warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r newsletter/newsletter/requirements.txt

      - name: Write Subscriber Lists
        env:
          NEWSLETTER_SUBSCRIBERS_CSV: ${{ secrets.NEWSLETTER_SUBSCRIBERS_CSV }}
          NEWSLETTER_PREVIEW_SUBSCRIBERS_CSV: ${{ secrets.NEWSLETTER_PREVIEW_SUBSCRIBERS_CSV }}
        run: |
          if [ -n "$NEWSLETTER_SUBSCRIBERS_CSV" ]; then
            printf "%s" "$NEWSLETTER_SUBSCRIBERS_CSV" > newsletter/newsletter/subscribers.csv
          fi
          if [ -n "$NEWSLETTER_PREVIEW_SUBSCRIBERS_CSV" ]; then
            printf "%s" "$NEWSLETTER_PREVIEW_SUBSCRIBERS_CSV" > newsletter/newsletter/preview_subscribers.csv
          fi

      - name: Run Daily Newsletter Pipeline
        env:
          NEWSLETTER_GMAIL_USER: ${{ secrets.NEWSLETTER_GMAIL_USER }}
          NEWSLETTER_GMAIL_APP_PASSWORD: ${{ secrets.NEWSLETTER_GMAIL_APP_PASSWORD }}
          NEWSLETTER_SEND_CURATION_REMINDER: "0"
          NEWSLETTER_CURATION_HOUR: "0"
          NEWSLETTER_CURATION_MINUTE: "01"
          NEWSLETTER_CURATION_WINDOW_MINUTES: "240"
          NEWSLETTER_SEND_HOUR: "10"
          NEWSLETTER_SEND_MINUTE: "00"
          NEWSLETTER_SEND_WINDOW_MINUTES: "120"
          NEWSLETTER_AUTO_SEND: "0"
          NEWSLETTER_DELAY_SEND: "1"
          NEWSLETTER_SYNC_ARCHIVE: "1"
          NEWSLETTER_SYNC_PUSH: "1"
          NEWSLETTER_AUTO_SEND_WEEKLY: "1"
          NEWSLETTER_WEEKLY_SEND_DOW: "5"
          NEWSLETTER_WEEKLY_SOCIAL: "1"
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_ID: ${{ secrets.LINKEDIN_MEMBER_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          SOCIAL_CHANNELS: "twitter,bluesky"
        run: |
          cd newsletter/newsletter
          chmod +x run_daily.sh
          ./run_daily.sh

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add newsletter/ content/newsletter/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Sync newsletter archive ($(date +%Y-%m-%d))"
          # Retry pull-rebase + push so concurrent automation (podcast sync) cannot diverge main
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed, retrying after fetch..."
            git fetch origin main
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1
