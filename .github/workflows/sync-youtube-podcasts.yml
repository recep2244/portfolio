name: Sync YouTube Podcasts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Sync podcast entries
        env:
          YOUTUBE_CHANNEL_ID: UCg6z3fAXEG01CMVFpS7-i-g
        run: python scripts/sync_youtube_podcasts.py --handle recepadyaman_proteins --limit 6

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cv.yaml
          git commit -m "Sync podcast episodes from YouTube"
          git push
