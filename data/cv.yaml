summary: Computational structural biologist with 9+ years of research experience in
  protein structure prediction, molecular dynamics simulation, and AI/ML-driven drug
  design. Developer of multiple internationally benchmarked tools (IntFOLD, ReFOLD,
  FunFOLD, MultiFOLD, ModFOLDdock2Q) that consistently rank among the top methods
  at CASP blind prediction experiments. Published 14 peer-reviewed papers (H-index
  9, 470+ citations) in journals including Nucleic Acids Research, Blood, and Bioinformatics
  Advances. Currently combining deep learning structure predictors (AlphaFold2/3,
  Boltz-2, Chai-1) with physics-based methods for cancer vaccine design in collaboration
  with InstaDeep/BioNTech. Experienced in Python, PyTorch, HPC/SLURM environments,
  and end-to-end bioinformatics pipeline development.
highlights:
- 'ReFOLD3: top-5 CASP13; best server at CASP14 (NAR Web Server 2021)'
- 'ReFOLD4: lifted models beyond AlphaFold2 with QA-guided MD recycling'
- 'FunFOLD5: 2nd place CASP16 ligand-pose ranking; surpasses AlphaFold3 server'
- 'MultiFOLD3: outperformed AlphaFold3 in quaternary structure prediction (CAMEO)'
- 'ModFOLDdock2Q: 16,000+ engineered features for protein binder quality assessment'
- 'IntFOLD server: 30,000+ users & 400,000+ jobs/year serving the research community'
- 'OpenStructure contributor: --min-pep-length parameter for peptide QA accuracy'
- 'InstaDeep/BioNTech: TCR-pMHC pipeline for personalised cancer vaccine programme'
experience:
- title: Collaborative Researcher (Part-Time)
  org: InstaDeep (BioNTech Group)
  location: London, UK
  period: 2023 – Present
  bullets:
  - Designed and developed a protein structure prediction pipeline for structural
    immunology, integrating TCR-pMHC modelling using AlphaFold2, Boltz-2, and Chai-1
    to support BioNTech's personalised cancer vaccine programme.
  - Contributed the --min-pep-length parameter to the OpenStructure framework, improving
    peptide quality assessment accuracy.
  - Engineered a hybrid scoring system combining physics-based energy terms (FoldX,
    Rosetta) with ML-based features (DockQ, QS, PatchDockQ, PatchQS, ilDDT, aa-local-lddt,
    ics scores) for candidate ranking and selection.
  - Collaborated with cross-functional teams spanning computational biology, experimental
    immunology, and vaccine development.
- title: Research Fellow
  org: McGuffin Lab, University of Reading
  location: Reading, UK
  period: Sep 2020 – Present
  funding: BBSRC-funded
  bullets:
  - Co-led the development and maintenance of IntFOLD integrated server for 3D protein
    model prediction, serving 30,000+ users and 400,000+ jobs every year.
  - Built ModFOLDdock2Q, a model quality assessment method utilising over 16,000 engineered
    features, achieving significant performance for identification of better protein
    binders.
  - Led ReFOLD4 development — MD-based refinement protocol that improves 3D predictions
    beyond AlphaFold2 accuracy by integrating local quality estimation with MD simulations
    (Bioinformatics Advances, 2023).
  - Led FunFOLD5 development for CASP16, achieving 2nd place in protein-ligand pose
    ranking and surpassing AlphaFold3 server method in protein-ligand interaction
    prediction.
  - Contributed to MultiFOLD3, which outperformed AlphaFold3 in quaternary structure
    prediction by integrating Boltz-2, Chai-1, Protenix and geometric-based rescoring
    in CAMEO.
  - ReFOLD3 ranked top-5 in CASP13 for difficult refinement targets; became top-performing
    refinement server at CASP14 (NAR Web Server Issue, 2021).
  - Published 10+ papers across Nucleic Acids Research, Bioinformatics Advances, Proteins,
    and Haematologica.
