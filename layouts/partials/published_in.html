<div class="border-y border-[color:var(--color-panel)]">
    <div class="container mx-auto px-6 py-8">
        <p class="text-xs uppercase tracking-[0.2em] text-slate-400 text-center mb-5">Published in</p>
        <div class="flex flex-wrap items-center justify-center text-slate-500">
            {{ $journals := slice "Nucleic Acids Research" "Blood" "Bioinformatics Advances" "Proteins" "Haematologica" "Int. J. Molecular Sciences" }}
            {{ range $journals }}
            <span class="text-base md:text-lg font-semibold tracking-tight whitespace-nowrap px-5 py-1.5">{{ . }}</span>
            {{ end }}
        </div>
    </div>
</div>
