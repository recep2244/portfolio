{{ $showHeading := .showHeading | default true }}
{{ $dark := .dark | default false }}
<div class="{{ if $dark }}bg-transparent{{ else }}max-w-xl mx-auto bg-white rounded-3xl p-8 shadow-xl border border-slate-100{{ end }}">
    {{ if $showHeading }}
    <h3 class="text-2xl font-black {{ if $dark }}text-white{{ else }}text-slate-900{{ end }} mb-2">Subscribe to Protein Design Digest</h3>
    <p class="{{ if $dark }}text-slate-400{{ else }}text-slate-500{{ end }} mb-6">Daily curated signals from arXiv, PubMed, and BioRxiv.</p>
    {{ end }}
    <form action="https://formsubmit.co/recepadiyaman2244@gmail.com" method="POST" class="space-y-4">
        <input type="hidden" name="_next" value="https://recep2244.github.io/portfolio/subscribe-success.html">
        <input type="hidden" name="_subject" value="New Protein Digest Subscriber!">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="box">

        <div>
            <label for="subscribe-name" class="block text-sm font-semibold {{ if $dark }}text-slate-300{{ else }}text-slate-700{{ end }} mb-1.5">First Name</label>
            <input type="text" id="subscribe-name" name="name" placeholder="John" required
                class="w-full px-4 py-3 rounded-xl border-2 {{ if $dark }}border-white/10 bg-white/10 text-white placeholder:text-slate-500 focus:border-cyan-400{{ else }}border-slate-200 bg-white text-slate-900 focus:border-teal-600{{ end }} outline-none transition-colors">
        </div>
        <div>
            <label for="subscribe-email" class="block text-sm font-semibold {{ if $dark }}text-slate-300{{ else }}text-slate-700{{ end }} mb-1.5">Email Address</label>
            <input type="email" id="subscribe-email" name="email" placeholder="you@example.com" required
                class="w-full px-4 py-3 rounded-xl border-2 {{ if $dark }}border-white/10 bg-white/10 text-white placeholder:text-slate-500 focus:border-cyan-400{{ else }}border-slate-200 bg-white text-slate-900 focus:border-teal-600{{ end }} outline-none transition-colors">
        </div>

        <div style="display:flex; align-items:center; justify-content:space-around; padding:0.6rem 0.75rem; border-radius:0.75rem; border:2px solid {{ if $dark }}rgba(255,255,255,0.1){{ else }}#e2e8f0{{ end }}; background:{{ if $dark }}rgba(255,255,255,0.05){{ else }}#f8fafc{{ end }};">
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
                <input type="radio" name="frequency" value="daily" checked
                    style="width:1rem; height:1rem; accent-color:{{ if $dark }}#22d3ee{{ else }}#0d9488{{ end }};">
                <span style="font-size:0.875rem; font-weight:600; color:{{ if $dark }}#e2e8f0{{ else }}#334155{{ end }};">Daily Papers</span>
            </label>
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
                <input type="radio" name="frequency" value="weekly"
                    style="width:1rem; height:1rem; accent-color:{{ if $dark }}#22d3ee{{ else }}#0d9488{{ end }};">
                <span style="font-size:0.875rem; font-weight:600; color:{{ if $dark }}#e2e8f0{{ else }}#334155{{ end }};">Weekly Digest</span>
            </label>
        </div>

        <button type="submit"
            style="width:100%; padding:0.875rem 1rem; font-weight:700; border-radius:0.75rem; transition:all 0.2s; cursor:pointer; font-size:1rem; border:none; display:block;
            {{ if $dark }}background:#06b6d4; color:#0f172a;{{ else }}background:#0f766e; color:#ffffff;{{ end }}">
            Subscribe Free →
        </button>
    </form>
</div>
