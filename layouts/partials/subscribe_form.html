{{ $showHeading := .showHeading | default true }}
<div class="max-w-xl mx-auto bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
    {{ if $showHeading }}
    <h3 class="text-2xl font-black text-slate-900 mb-2">Subscribe to Protein Design Digest</h3>
    <p class="text-slate-500 mb-6">Daily curated signals from arXiv, PubMed, and BioRxiv.</p>
    {{ end }}
    <form action="https://formsubmit.co/recepadiyaman2244@gmail.com" method="POST" class="space-y-5">
        <input type="hidden" name="_next" value="https://recep2244.github.io/portfolio/subscribe-success.html">
        <input type="hidden" name="_subject" value="New Protein Digest Subscriber!">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="box">

        <div class="space-y-4">
            <div>
                <label for="subscribe-name" class="block text-sm font-semibold text-slate-700 mb-2">First Name</label>
                <input type="text" id="subscribe-name" name="name" placeholder="John" required
                    class="w-full px-4 py-3 rounded-lg border-2 border-slate-200 focus:border-teal-600 outline-none transition-colors bg-white">
            </div>
            <div>
                <label for="subscribe-email" class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                <input type="email" id="subscribe-email" name="email" placeholder="john@example.com" required
                    class="w-full px-4 py-3 rounded-lg border-2 border-slate-200 focus:border-teal-600 outline-none transition-colors bg-white">
            </div>
        </div>

        <div class="flex items-center justify-around py-2 bg-slate-50 rounded-lg border border-slate-100">
            <label class="flex items-center gap-2 cursor-pointer group">
                <input type="radio" name="frequency" value="daily" checked class="accent-teal-700">
                <span class="text-sm font-medium text-slate-600 group-hover:text-teal-700">Daily Papers</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer group">
                <input type="radio" name="frequency" value="weekly" class="accent-teal-700">
                <span class="text-sm font-medium text-slate-600 group-hover:text-teal-700">Weekly Digest</span>
            </label>
        </div>

        <button type="submit"
            class="w-full py-4 bg-teal-700 text-white font-bold rounded-lg hover:bg-teal-800 transition-all shadow-lg hover:shadow-teal-900/20 cursor-pointer text-lg">
            Subscribe Free
        </button>
    </form>
</div>
