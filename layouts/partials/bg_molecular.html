{{/* Original abstract molecular-field background — Isomorphic-spirit, not copied.
     Soft gradient blobs + a protein-like node/bond network + contour arcs. */}}
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1200 700"
    preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="z-index:0">
    <defs>
        <radialGradient id="bgBlobA" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2563eb" stop-opacity="0.10" />
            <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="bgBlobB" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0d9488" stop-opacity="0.10" />
            <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="bgBond" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#0d9488" />
        </linearGradient>
    </defs>

    <!-- soft molecular "clouds" -->
    <circle cx="200" cy="160" r="260" fill="url(#bgBlobA)" />
    <circle cx="1010" cy="540" r="300" fill="url(#bgBlobB)" />

    <!-- concentric contour arcs (right) -->
    <g fill="none" stroke="#2563eb" stroke-opacity="0.12">
        <circle cx="1030" cy="180" r="70" />
        <circle cx="1030" cy="180" r="120" stroke-dasharray="3 9" />
        <circle cx="1030" cy="180" r="175" stroke-opacity="0.07" />
    </g>

    <!-- abstract protein node/bond network (left) -->
    <g stroke="url(#bgBond)" stroke-opacity="0.22" stroke-width="1.2" fill="none">
        <path d="M120,470 C200,400 260,520 340,440 C420,360 470,500 560,430" />
        <path d="M150,560 C240,520 300,600 400,540 C500,480 540,580 640,520" stroke-opacity="0.14" />
        <line x1="120" y1="470" x2="150" y2="560" />
        <line x1="340" y1="440" x2="400" y2="540" />
        <line x1="560" y1="430" x2="640" y2="520" />
    </g>
    <g fill="#0d9488" fill-opacity="0.5">
        <circle cx="120" cy="470" r="3.5" /><circle cx="340" cy="440" r="3" />
        <circle cx="560" cy="430" r="3.5" /><circle cx="400" cy="540" r="3" />
        <circle cx="640" cy="520" r="2.5" />
    </g>
    <g fill="#2563eb" fill-opacity="0.5">
        <circle cx="150" cy="560" r="3" /><circle cx="260" cy="497" r="2.5" />
    </g>
</svg>
