<header
    class="fixed top-0 w-full z-50 transition-all duration-300 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <a href="{{ .Site.BaseURL }}"
            class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-accent to-blue-400 hover:opacity-80 transition-opacity">
            Recep Adiyaman
        </a>

        <nav class="hidden md:flex items-center" style="gap:0.75rem; flex-wrap:nowrap; overflow:visible;">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}"
                style="font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#64748b; white-space:nowrap; transition:color 0.2s; text-decoration:none;"
                onmouseover="this.style.color='var(--accent,#2563eb)'" onmouseout="this.style.color='#64748b'">
                {{ .Name }}
            </a>
            {{ end }}
            <a href="#newsletter"
                style="padding:0.5rem 1rem; background:var(--accent,#2563eb); color:#fff; border-radius:9999px; font-weight:900; font-size:0.65rem; text-transform:uppercase; letter-spacing:0.08em; white-space:nowrap; box-shadow:0 4px 14px rgba(37,99,235,0.25); transition:transform 0.2s; text-decoration:none; flex-shrink:0;"
                onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                Subscribe
            </a>
        </nav>

        <button id="mobile-menu-toggle" class="md:hidden text-slate-600 hover:text-slate-900"
            aria-controls="mobile-menu" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>

    <div id="mobile-menu"
        class="md:hidden hidden border-t border-slate-200 bg-white/95 backdrop-blur-md">
        <div class="container mx-auto px-6 py-4 flex flex-col gap-4">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}" data-mobile-link
                class="text-xs font-bold text-slate-600 uppercase tracking-widest">
                {{ .Name }}
            </a>
            {{ end }}
            <a href="#newsletter" data-mobile-link
                class="inline-flex items-center justify-center px-5 py-2.5 bg-accent text-white rounded-full font-black text-xs uppercase tracking-widest shadow-lg shadow-accent/20">
                Subscribe
            </a>
        </div>
    </div>
</header>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const toggle = document.getElementById("mobile-menu-toggle");
        const menu = document.getElementById("mobile-menu");
        if (!toggle || !menu) {
            return;
        }
        const closeMenu = () => {
            menu.classList.add("hidden");
            toggle.setAttribute("aria-expanded", "false");
        };
        toggle.addEventListener("click", () => {
            const isOpen = !menu.classList.contains("hidden");
            if (isOpen) {
                closeMenu();
            } else {
                menu.classList.remove("hidden");
                toggle.setAttribute("aria-expanded", "true");
            }
        });
        menu.querySelectorAll("[data-mobile-link]").forEach((link) => {
            link.addEventListener("click", () => {
                closeMenu();
            });
        });
    });
</script>
