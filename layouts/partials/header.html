<header
    class="fixed top-0 w-full z-50 transition-all duration-300 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <a href="{{ .Site.BaseURL }}"
            class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-teal-700 to-teal-500 hover:opacity-80 transition-opacity">
            Recep Adiyaman
        </a>

        <nav class="hidden md:flex items-center gap-3">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}" class="nav-link" data-nav-link>{{ .Name }}</a>
            {{ end }}
            <a href="#newsletter" class="nav-pill">Subscribe</a>
        </nav>

        <button id="mobile-menu-toggle" class="md:hidden text-slate-600 hover:text-slate-900"
            aria-controls="mobile-menu" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>

    <div id="mobile-menu"
        class="md:hidden border-t border-slate-200 bg-white/95 backdrop-blur-md overflow-hidden"
        style="max-height:0;transition:max-height 0.3s ease">
        <div class="container mx-auto px-6 py-4 flex flex-col gap-4">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}" data-mobile-link
                class="text-xs font-bold text-slate-500 hover:text-accent uppercase tracking-widest transition-colors">
                {{ .Name }}
            </a>
            {{ end }}
            <a href="#newsletter" data-mobile-link
                class="inline-flex items-center justify-center px-5 py-2.5 bg-accent text-white rounded-full font-black text-xs uppercase tracking-widest shadow-lg shadow-accent/20">
                Subscribe
            </a>
        </div>
    </div>
</header>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // ── Mobile menu with smooth slide animation ─────────────────────────────
    const toggle = document.getElementById("mobile-menu-toggle");
    const menu   = document.getElementById("mobile-menu");
    if (toggle && menu) {
        const openMenu = () => {
            menu.style.maxHeight = menu.scrollHeight + "px";
            toggle.setAttribute("aria-expanded", "true");
        };
        const closeMenu = () => {
            menu.style.maxHeight = "0";
            toggle.setAttribute("aria-expanded", "false");
        };
        toggle.addEventListener("click", () => {
            menu.style.maxHeight === "0px" || !menu.style.maxHeight ? openMenu() : closeMenu();
        });
        menu.querySelectorAll("[data-mobile-link]").forEach(link => {
            link.addEventListener("click", closeMenu);
        });
    }

    // ── Scroll spy: highlight active nav link ───────────────────────────────
    const sections  = document.querySelectorAll("section[id]");
    const navLinks  = document.querySelectorAll("[data-nav-link]");
    if (sections.length && navLinks.length) {
        const spy = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const id = entry.target.id;
                navLinks.forEach(a => {
                    const match = a.getAttribute("href").includes("#" + id) ||
                                  a.getAttribute("href").endsWith("/" + id + "/");
                    a.classList.toggle("nav-link-active", match);
                });
            });
        }, { rootMargin: "-40% 0px -55% 0px" });
        sections.forEach(s => spy.observe(s));
    }
});
</script>
