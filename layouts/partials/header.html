<header
    class="fixed top-0 w-full z-50 transition-all duration-300 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <a href="{{ .Site.BaseURL }}"
            class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-accent to-blue-400 hover:opacity-80 transition-opacity">
            Recep Adiyaman
        </a>

        <nav class="hidden md:flex space-x-6 items-center">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}"
                class="text-sm font-bold text-slate-500 hover:text-accent transition-colors relative group uppercase tracking-widest">
                {{ .Name }}
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-accent transition-all group-hover:w-full"></span>
            </a>
            {{ end }}
            <a href="{{ "newsletter/" | relURL }}"
                class="px-5 py-2.5 bg-accent text-white rounded-full font-black text-xs uppercase tracking-widest shadow-lg shadow-accent/20 hover:scale-105 transition-all">
                Subscribe
            </a>
        </nav>

        <button id="mobile-menu-toggle" class="md:hidden text-slate-600 hover:text-slate-900"
            aria-controls="mobile-menu" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>

    <div id="mobile-menu"
        class="md:hidden hidden border-t border-slate-200 bg-white/95 backdrop-blur-md">
        <div class="container mx-auto px-6 py-4 flex flex-col gap-4">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}" data-mobile-link
                class="text-xs font-bold text-slate-600 uppercase tracking-widest">
                {{ .Name }}
            </a>
            {{ end }}
            <a href="{{ "newsletter/" | relURL }}" data-mobile-link
                class="inline-flex items-center justify-center px-5 py-2.5 bg-accent text-white rounded-full font-black text-xs uppercase tracking-widest shadow-lg shadow-accent/20">
                Subscribe
            </a>
        </div>
    </div>
</header>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const toggle = document.getElementById("mobile-menu-toggle");
        const menu = document.getElementById("mobile-menu");
        if (!toggle || !menu) {
            return;
        }
        const closeMenu = () => {
            menu.classList.add("hidden");
            toggle.setAttribute("aria-expanded", "false");
        };
        toggle.addEventListener("click", () => {
            const isOpen = !menu.classList.contains("hidden");
            if (isOpen) {
                closeMenu();
            } else {
                menu.classList.remove("hidden");
                toggle.setAttribute("aria-expanded", "true");
            }
        });
        menu.querySelectorAll("[data-mobile-link]").forEach((link) => {
            link.addEventListener("click", () => {
                closeMenu();
            });
        });
    });
</script>
