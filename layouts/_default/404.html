{{ define "main" }}
<section class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center px-6">
  <div class="text-center max-w-lg mx-auto">
    <div class="text-8xl font-black text-cyan-400 mb-4 leading-none">404</div>
    <h1 class="text-2xl md:text-3xl font-extrabold text-white mb-4">Page not found</h1>
    <p class="text-slate-400 text-base mb-10 leading-relaxed">
      This page doesn't exist or may have moved. Try browsing the newsletter archive or head back to the portfolio.
    </p>
    <div class="flex flex-wrap justify-center gap-3">
      <a href="{{ "/" | relURL }}"
        class="px-6 py-3 bg-cyan-500 text-slate-900 font-bold rounded-xl hover:bg-cyan-400 transition-colors text-sm">
        Back to Portfolio
      </a>
      <a href="{{ "newsletter/" | relURL }}"
        class="px-6 py-3 bg-white/10 text-white font-bold rounded-xl hover:bg-white/20 transition-colors text-sm border border-white/20">
        Newsletter Archive
      </a>
    </div>
  </div>
</section>
{{ end }}
